# Pinned rules data. The engine reads every balance number from here, and
# internal/rules rejects the file at startup if anything is unknown or
# inconsistent. Values are written in game units (HP 10, damage scale 4.5);
# the loader converts HP, attack, defense and combat constants to x10
# integers.
#
# Units and techs are seed data from the design doc: complete them and
# verify them against the pinned build in #8.
version: v1
game_build: "Android 2.17.3.16375"

units:
  # warrior stats confirmed in ADR 0001; others verify on pinned build
  warrior: { cost: 2, hp: 10, attack: 2, defense: 2, move: 1, range: 1, tech: null, skills: [dash, fortify] }
  archer:  { cost: 3, hp: 10, attack: 2, defense: 1, move: 1, range: 2, tech: archery, skills: [dash, fortify] }  # verify on pinned build
  # skill vocabulary for MVP: dash, escape, fortify, persist (semantics verify on pinned build)

techs:
  # tier is 1 for roots and parent tier + 1 otherwise; verify on pinned build
  organization: { tier: 1, requires: null, unlocks: [harvest_fruit] }
  hunting:      { tier: 1, requires: null, unlocks: [harvest_game] }
  archery:      { tier: 2, requires: hunting, unlocks: [forest_defense] }

veterancy:
  kills_required: 3  # confirmed in ADR 0001

city:
  level_up_rewards:  # options per level: verify on pinned build
    2: [workshop, explorer]
    3: [city_wall, resources]
    4: [population_growth, border_growth]
  mvp_excluded_rewards: [explorer]  # moves randomly; chance nodes are a v2 option
  max_city_level: 4  # MVP cap; level 5+ rewards (park, super unit: verify on pinned build) are out of scope

unused_in_mvp:  # naval is out of scope
  buildings: [port]
  resources: [fish]

combat:
  formula: community_v1  # confirmed in ADR 0001
  damage_scale: 4.5      # confirmed in ADR 0001
  defense_bonus: 1.5     # city without walls; confirmed in ADR 0001
  wall_bonus: 4          # verify on pinned build
