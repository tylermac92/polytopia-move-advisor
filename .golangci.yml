version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: package-comments
        - name: exported
        - name: var-naming
        - name: error-naming
        - name: error-strings
        - name: receiver-naming
        - name: indent-error-flow

formatters:
  enable:
    - gofmt
    - goimports
